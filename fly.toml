# fly.toml app configuration file generated for tiktokliveandroid on 2026-10-31T03:58:14Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tiktokliveandroid'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  TTL_PORT = '8080'
  TTL_TUNNEL = '0'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 100

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/ping'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
