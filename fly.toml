# ============================================================
# Fly.io — TikTok Live Reader Engine
#   flyctl launch --no-deploy   (sekali)
#   flyctl secrets set TTL_API_KEY=xxxxx
#   flyctl deploy
# ============================================================
app = "tiktokliveandsroid"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  TTL_PORT = "8080"
  # tunnel cloudflared tidak dipakai di Fly (koneksi keluar = IP datacenter)
  TTL_TUNNEL = "0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/ping"
